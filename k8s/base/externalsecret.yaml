# Pulls the entire environment's .env key-values from a single JSON secret in GCP Secret Manager
# (e.g. secret name "music-platform-qa01", "music-platform-qa02", "music-platform-prod01")
# into a native Kubernetes Secret "music-platform-env".
# No per-environment ConfigMap files needed in Git!
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: music-platform-env
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: music-platform-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        # Replaced automatically per context (e.g. music-platform-qa01, music-platform-prod01)
        key: music-platform-CONTEXT_Placeholder
