apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: music-platform
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: music-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: music-platform
    spec:
      serviceAccountName: music-platform-sa
      # Pod-level security context: run strictly as non-root UID/GID 1001 (nextjs:nodejs)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Blocks the music-platform container from starting until postgres:5432 is accepting connections
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL at postgres:5432..."
              until nc -z -w 2 postgres 5432; do
                echo "PostgreSQL not ready yet, sleeping 2s..."
                sleep 2
              done
              echo "PostgreSQL is up and accepting connections!"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: music-platform
          image: music-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # All .env properties (DATABASE_URL, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
          # SESSION_SECRET, NEXT_PUBLIC_SITE_URL, SMTP_*) come from GCP Secret Manager
          # via the ExternalSecret -> Secret/music-platform-env.
          envFrom:
            - secretRef:
                name: music-platform-env
          env:
            - name: NODE_ENV
              value: "production"
            - name: UPLOAD_DIR
              value: "/app/uploads"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          emptyDir: {}
