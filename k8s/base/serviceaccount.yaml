apiVersion: v1
kind: ServiceAccount
metadata:
  name: music-platform-sa
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    # GKE Workload Identity: binds this Kubernetes ServiceAccount to the GCP IAM Service Account
    # that has roles/secretmanager.secretAccessor in GCP Secret Manager.
    iam.gke.io/gcp-service-account: music-platform-gsa@surshongi.iam.gserviceaccount.com
automountServiceAccountToken: false
