# One-time per GKE cluster setup: connects External Secrets Operator to GCP Secret Manager
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: surshongi
      auth:
        # Option A (GKE Workload Identity — keyless):
        # Uses the Kubernetes ServiceAccount "external-secrets" (in namespace "external-secrets")
        # which is bound to GCP IAM Service Account "external-secrets-gsa@surshongi.iam.gserviceaccount.com"
        # that has the IAM role "roles/secretmanager.secretAccessor".
        workloadIdentity:
          clusterLocation: asia-south1-a
          clusterName: surshongi-qa
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

        # Option B (If running outside GKE or using a Service Account JSON key):
        # secretRef:
        #   secretAccessKeySecretRef:
        #     name: gcp-secret-manager-creds
        #     namespace: external-secrets
        #     key: gcp-creds.json
