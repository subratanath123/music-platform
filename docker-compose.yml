services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: surshongi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: surshongi
      POSTGRES_PASSWORD: surshongi_pass
      POSTGRES_DB: surshongi_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surshongi -d surshongi_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surshongi-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Google, session and SMTP secrets come from .env.local (see .env.example).
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://surshongi:surshongi_pass@postgres:5432/surshongi_db
      UPLOAD_DIR: /app/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./public/uploads:/app/uploads

volumes:
  pgdata:
